[advanced]
param=compiler.addRemapRegisterSlice=true
misc=solution_name=cluster

[connectivity]
nk=cluster:1:cluster_1
slr=cluster_1:SLR2
sp=cluster_1.m_axi_gmem0:DDR[2]
sp=cluster_1.m_axi_gmem1:DDR[2]
sp=cluster_1.m_axi_gmem2:DDR[2]
sp=cluster_1.m_axi_gmem3:DDR[2]
sp=cluster_1.m_axi_gmem4:DDR[2]
sp=cluster_1.m_axi_gmem5:DDR[2]
sp=cluster_1.m_axi_gmem6:DDR[2]
sp=cluster_1.m_axi_gmem7:DDR[2]
sp=cluster_1.m_axi_gmem8:DDR[2]

[clock]
freqHz=150000000:cluster_1

[vivado]
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=/home/tls/dev/heterogeneous-vitis-apps/apps/override_timing.tcl
prop=run.impl_1.strategy=Performance_Explore
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
